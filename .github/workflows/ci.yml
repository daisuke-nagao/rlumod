name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install pre-commit
        run: python3 -m pip install -r requirements.txt
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Check C FFI formatting
        run: cargo +stable fmt --manifest-path c-ffi/Cargo.toml -- --check
      - name: Lint C FFI
        run: cargo +stable clippy --manifest-path c-ffi/Cargo.toml --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --all-features --no-deps
      - name: Verify package
        run: cargo +stable package
      - name: Verify C FFI is excluded from the Rust package
        shell: bash
        run: '! cargo +stable package --list | grep -q ''^c-ffi/'''

  native-tests:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            experimental: false
          - runner: ubuntu-24.04
            experimental: false
            ffi: true
          - runner: ubuntu-22.04-arm
            experimental: false
          - runner: ubuntu-24.04-arm
            experimental: false
          - runner: windows-2022
            experimental: false
            ffi: true
          - runner: windows-2025
            experimental: false
          - runner: windows-11-arm
            experimental: false
          - runner: macos-15-intel
            experimental: false
          - runner: macos-26-intel
            experimental: false
          - runner: macos-15
            experimental: false
            ffi: true
          - runner: macos-26
            experimental: false
          - runner: ubuntu-26.04
            experimental: true
          - runner: ubuntu-26.04-arm
            experimental: true
          - runner: windows-11-vs2026-arm
            experimental: true
          - runner: xcode-27
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        run: cargo +stable test --all-features
      - name: Build C FFI static library
        if: matrix.ffi == true
        run: cargo +stable build --manifest-path c-ffi/Cargo.toml --release
      - name: Compile and run C and C++ FFI smoke tests
        if: matrix.ffi == true && runner.os != 'Windows'
        shell: bash
        run: |
          archive="c-ffi/target/release/librlumod_c_ffi.a"
          cc -std=c11 -Wall -Wextra -Werror -Ic-ffi/include \
            c-ffi/tests/smoke.c "${archive}" -lm -o c-ffi/target/smoke-c
          c-ffi/target/smoke-c
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -Ic-ffi/include \
            c-ffi/tests/smoke.c -x none "${archive}" -lm -o c-ffi/target/smoke-cpp
          c-ffi/target/smoke-cpp
      - name: Compile and run MSVC C and C++ FFI smoke tests
        if: matrix.ffi == true && runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cl /nologo /W4 /WX /std:c11 /Ic-ffi\include c-ffi\tests\smoke.c /Fe:c-ffi\target\smoke-c.exe /link c-ffi\target\release\rlumod_c_ffi.lib
          c-ffi\target\smoke-c.exe
          cl /nologo /W4 /WX /TP /std:c++17 /Ic-ffi\include c-ffi\tests\smoke.c /Fe:c-ffi\target\smoke-cpp.exe /link c-ffi\target\release\rlumod_c_ffi.lib
          c-ffi\target\smoke-cpp.exe
      - name: Verify unmangled C FFI symbols
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          nm -g --defined-only c-ffi/target/release/librlumod_c_ffi.a | awk '{print $3}' > c-ffi/target/symbols.txt
          for symbol in LUmod Lprod LUforw LUback Usolve elm elmgen; do
            grep -Fx "${symbol}" c-ffi/target/symbols.txt
          done

  msrv:
    name: Test MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --target thumbv7em-none-eabi
      - name: Run all targets on the MSRV
        run: cargo +1.85.0 test --all-targets --all-features
      - name: Test and build C FFI on the MSRV
        run: |
          cargo +1.85.0 test --manifest-path c-ffi/Cargo.toml
          cargo +1.85.0 build --manifest-path c-ffi/Cargo.toml --release
      - name: Check no_std C FFI target on the MSRV
        run: cargo +1.85.0 check --manifest-path c-ffi/Cargo.toml --target thumbv7em-none-eabi --release

  wasi-tests:
    name: Test WebAssembly (WASI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable and WASI target
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1
      - name: Install Wasmtime
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: wasmtime@47.0.3
          fallback: none
      - name: Run tests in Wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo +stable test --target wasm32-wasip1 --all-features --lib --tests

  browser-tests:
    name: Test WebAssembly (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable and browser WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run tests in headless Chrome
        run: wasm-pack test --headless --chrome -- --all-features
