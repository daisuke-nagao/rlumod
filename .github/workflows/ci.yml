name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install pre-commit
        run: python3 -m pip install -r requirements.txt
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Lint downstream staticlib fixture
        run: cargo +stable clippy --manifest-path tests/staticlib/Cargo.toml --lib -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --all-features --no-deps
      - name: Verify package
        run: cargo +stable package
      - name: Verify C FFI header is included in the Rust package
        shell: bash
        run: |
          cargo +stable package --list | grep -Fx 'include/lumod-c/lumod_dense.h'
          cargo +stable package --list | grep -Fx 'include/rlumod/rlumod.h'

  native-tests:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            experimental: false
          - runner: ubuntu-24.04
            experimental: false
            ffi: true
          - runner: ubuntu-22.04-arm
            experimental: false
          - runner: ubuntu-24.04-arm
            experimental: false
          - runner: windows-2022
            experimental: false
            ffi: true
          - runner: windows-2025
            experimental: false
          - runner: windows-11-arm
            experimental: false
          - runner: macos-15-intel
            experimental: false
          - runner: macos-26-intel
            experimental: false
          - runner: macos-15
            experimental: false
            ffi: true
          - runner: macos-26
            experimental: false
          - runner: ubuntu-26.04
            experimental: true
          - runner: ubuntu-26.04-arm
            experimental: true
          - runner: windows-11-vs2026-arm
            experimental: true
          - runner: xcode-27
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        run: cargo +stable test --all-features
      - name: Build downstream C FFI static library
        if: matrix.ffi == true
        run: cargo +stable build --manifest-path tests/staticlib/Cargo.toml --release
      - name: Compile and run C and C++ FFI smoke tests
        if: matrix.ffi == true && runner.os != 'Windows'
        shell: bash
        run: |
          archive="tests/staticlib/target/release/librlumod_staticlib_consumer.a"
          cc -std=c11 -Wall -Wextra -Werror -Iinclude \
            tests/staticlib/smoke.c "${archive}" -lm -o tests/staticlib/target/smoke-c
          tests/staticlib/target/smoke-c
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/staticlib/smoke.c -x none "${archive}" -lm -o tests/staticlib/target/smoke-cpp
          tests/staticlib/target/smoke-cpp
      - name: Compile and run MSVC C and C++ FFI smoke tests
        if: matrix.ffi == true && runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cl /nologo /W4 /WX /std:c11 /Iinclude tests\staticlib\smoke.c /Fe:tests\staticlib\target\smoke-c.exe /link tests\staticlib\target\release\rlumod_staticlib_consumer.lib
          tests\staticlib\target\smoke-c.exe
          cl /nologo /W4 /WX /TP /std:c++17 /Iinclude tests\staticlib\smoke.c /Fe:tests\staticlib\target\smoke-cpp.exe /link tests\staticlib\target\release\rlumod_staticlib_consumer.lib
          tests\staticlib\target\smoke-cpp.exe
      - name: Verify C FFI feature gate and unmangled symbols
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/feature-gate cargo +stable rustc --release \
            --no-default-features --features lumod-c --lib -- --emit=obj
          if nm -g --defined-only target/feature-gate/release/deps/rlumod-*.o | \
            awk '{print $3}' | \
            grep -Ex 'LUmod|Lprod|LUforw|LUback|Usolve|elm|elmgen'; then
            exit 1
          fi
          CARGO_TARGET_DIR=target/feature-gate-one cargo +stable rustc --release \
            --no-default-features --features c-ffi-one-based --lib -- --emit=obj
          nm -g --defined-only target/feature-gate-one/release/deps/rlumod-*.o | \
            awk '{print $3}' > target/feature-gate-one/symbols.txt
          for symbol in LUmod Lprod Usolve; do
            grep -Fx "${symbol}" target/feature-gate-one/symbols.txt
          done
          ! grep -E '^rlumod_' target/feature-gate-one/symbols.txt
          CARGO_TARGET_DIR=target/feature-gate-zero cargo +stable rustc --release \
            --no-default-features --features c-ffi-zero-based --lib -- --emit=obj
          nm -g --defined-only target/feature-gate-zero/release/deps/rlumod-*.o | \
            awk '{print $3}' > target/feature-gate-zero/symbols.txt
          for operation in factor_from_storage workspace_init push replace_row \
            replace_column remove solve_in_place solve_transpose_in_place; do
            grep -Fx "rlumod_f32_${operation}" target/feature-gate-zero/symbols.txt
            grep -Fx "rlumod_f64_${operation}" target/feature-gate-zero/symbols.txt
          done
          grep -Fx rlumod_storage_lengths target/feature-gate-zero/symbols.txt
          ! grep -Ex 'LUmod|Lprod|Usolve' target/feature-gate-zero/symbols.txt
          archive="tests/staticlib/target/release/librlumod_staticlib_consumer.a"
          nm -g --defined-only "${archive}" | awk '{print $3}' > tests/staticlib/target/symbols.txt
          for symbol in LUmod Lprod Usolve; do
            grep -Fx "${symbol}" tests/staticlib/target/symbols.txt
          done
          for operation in factor_from_storage workspace_init push replace_row \
            replace_column remove solve_in_place solve_transpose_in_place; do
            grep -Fx "rlumod_f32_${operation}" tests/staticlib/target/symbols.txt
            grep -Fx "rlumod_f64_${operation}" tests/staticlib/target/symbols.txt
          done
          grep -Fx rlumod_storage_lengths tests/staticlib/target/symbols.txt
          for symbol in LUforw LUback elm elmgen; do
            ! grep -Fx "${symbol}" tests/staticlib/target/symbols.txt
          done
          ! grep -Eq '(^|[^[:alnum:]_])(LUforw|LUback|elm|elmgen)([^[:alnum:]_]|$)' \
            include/lumod-c/lumod_dense.h

  msrv:
    name: Test MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --target thumbv7em-none-eabi
      - name: Run all targets on the MSRV
        run: cargo +1.85.0 test --all-targets --all-features
      - name: Build downstream C FFI staticlib on the MSRV
        run: cargo +1.85.0 build --manifest-path tests/staticlib/Cargo.toml --release
      - name: Check no_std C FFI target on the MSRV
        run: cargo +1.85.0 check --all-features --target thumbv7em-none-eabi --release

  wasi-tests:
    name: Test WebAssembly (WASI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable and WASI target
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1
      - name: Install Wasmtime
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasmtime@47.0.3
          fallback: none
      - name: Run tests in Wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo +stable test --target wasm32-wasip1 --all-features --lib --tests

  browser-tests:
    name: Test WebAssembly (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable and browser WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run tests in headless Chrome
        run: wasm-pack test --headless --chrome -- --all-features
